services:

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       soloq
      POSTGRES_USER:     soloq
      POSTGRES_PASSWORD: soloq_pass
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soloq -d soloq"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soloq_net

  # ── Backend Express ───────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     soloq
      DB_USER:     soloq
      DB_PASSWORD: soloq_pass
      PORT:        3000
      # ── Riot API ───────────────────────────────────────────────
      # Obtenir une clé sur https://developer.riotgames.com/
      # Dev key valable 24h ; Production key via formulaire Riot
      RIOT_API_KEY:   ${RIOT_API_KEY:-}       # à renseigner dans .env
      RIOT_PLATFORM:  ${RIOT_PLATFORM:-euw1}  # euw1 | na1 | kr | eun1 …
      RIOT_REGION:    ${RIOT_REGION:-europe}  # europe | americas | asia
      RIOT_TOP_N:              ${RIOT_TOP_N:-10}       # nb de joueurs à synchroniser
      RIOT_DELAY_MS:           ${RIOT_DELAY_MS:-1300}  # délai entre requêtes (ms)
      RIOT_SYNC_INTERVAL_MS:   ${RIOT_SYNC_INTERVAL_MS:-1800000}  # 30 min par défaut
    depends_on:
      db:
        condition: service_healthy
    networks:
      - soloq_net
    # Port exposé uniquement pour les tests directs (ex: curl localhost:3000/api/players)
    ports:
      - "3000:3000"

  # ── Frontend nginx ────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - soloq_net

volumes: {}

networks:
  soloq_net:
    driver: bridge
